name: Validate COC Structure

# ─────────────────────────────────────────────────────────────────────────
# CONSUMER-SCOPED COPY. Arbor is a `coc-project` downstream consumer, NOT a
# USE template. The upstream `kailash-coc-py` copy of this workflow carries
# three further steps that are structurally inapplicable here and are
# deliberately NOT included:
#
#   * "Image-pin mutual consistency (the six agree with each other)"
#     Checks docker-compose.yml / .devcontainer/devcontainer.json / bin/dev
#     for a pinned `kailash-coc-py:<semver>` image. Those are the COC
#     dev-container scaffold, distributed by the upstream manifest's
#     `dev_container_ownership` block to USE TEMPLATES only — the /migrate
#     `multi_cli_overlays.multi-cli.paths` set does not deliver them to a
#     consumer, and Arbor's own docker-compose.*.yml build the Arbor app,
#     not the COC dev image. The step reported MISSING on all three.
#
#   * "Cross-reference integrity (ratchet — fails only on regression)"
#     Ratchets against a baseline count (319) measured on the TEMPLATE's
#     artifact tree. Arbor's tree differs by construction (10 project
#     agents, 16 project skills, 3 project-local rules), so the number
#     measures nothing here.
#
#   * "Undeclared top-level surfaces (hard gate)"
#     Derives its allowlist by parsing the upstream distribution manifest,
#     which emit.mjs Validator 16 FORBIDS in a `coc-project` repo (a local
#     manifest would be a second distribution source). With no manifest the
#     parse yields <5 roots and the step fails closed by design; it would
#     also flag Arbor's own app roots (apps/, src/, deploy/, specs/, ...).
#
# The retained step IS consumer-applicable and is the one that guards this
# migration: it asserts all three CLI baselines exist and that no SDK-source
# reference leaks into .claude/ off-allowlist.
#
# STABILITY: this trim does NOT get reverted by a routine sync. validate.yml
# is absent from the upstream sync-manifest.yaml (no distribution contract),
# `/sync-from-template` touches no `.github/` path, and `/migrate --refresh`
# explicitly skips the Step-7 workflow refresh. Only a fresh full `/migrate`
# would re-copy it, and this repo is already `template_type: multi-cli`, so
# `/migrate` routes to `--refresh`.
#
# The upstream defect is still real — every consumer's first post-`/migrate`
# CI run goes red. Fix belongs upstream in kailash-coc-py: gate the three
# template-only steps on repo class (the template already ships
# `.claude/bin/repo-class.mjs`, which resolves it from `.claude/VERSION`).
# Recorded in .claude/.coc-sync-marker.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate structure
        run: |
          set -euo pipefail
          echo "Checking COC structure..."

          # Verify critical directories exist
          test -d .claude/agents && echo "✓ agents/"
          test -d .claude/skills && echo "✓ skills/"
          test -d .claude/rules && echo "✓ rules/"
          test -d .claude/commands && echo "✓ commands/"

          # Multi-CLI USE template MUST emit one baseline per CLI at root
          # (claude → CLAUDE.md, codex → AGENTS.md, gemini → GEMINI.md).
          # Per cross-cli-parity.md MUST Rule 3 (frontmatter priority+scope
          # are identical across CLIs) the three baselines are the always-on
          # surface for each CLI; missing one means that CLI's users get a
          # silently weaker rule surface.
          test -f CLAUDE.md && echo "✓ CLAUDE.md (claude baseline)"
          test -f AGENTS.md && echo "✓ AGENTS.md (codex baseline)"
          test -f GEMINI.md && echo "✓ GEMINI.md (gemini baseline)"

          # Check for contamination: src/kailash/ paths should not leak into
          # USE template .claude/ content EXCEPT for files on the allowlist.
          # Allowlist = files that legitimately guide developers working WITH
          # the kailash-py source tree (provenance, navigation, compliance).
          #
          # See .github/coc-sdk-refs-allowlist.txt to add exemptions.
          # The allowlist is auto-extended by loom's coc-sync agent on every
          # /sync Gate 2 distribute (see loom/.claude/agents/management/
          # coc-sync.md § "Step 7.5: Refresh SDK-Refs Allowlist").
          ALLOWLIST=.github/coc-sdk-refs-allowlist.txt
          if [ ! -f "$ALLOWLIST" ]; then
            echo "ERROR: missing $ALLOWLIST"
            exit 1
          fi

          # Strip comments/blanks from allowlist, sort for comm
          grep -vE '^\s*(#|$)' "$ALLOWLIST" | sort > /tmp/allowed.txt

          # Find all .claude/ files containing src/kailash/
          grep -rl "src/kailash/" .claude/ 2>/dev/null | sort > /tmp/found.txt || true

          # Compute: found \ allowed  (files with contamination not on allowlist)
          contamination=$(comm -23 /tmp/found.txt /tmp/allowed.txt)

          if [ -n "$contamination" ]; then
            echo ""
            echo "ERROR: src/kailash/ references found in files not on allowlist:"
            echo "$contamination" | sed 's/^/  /'
            echo ""
            echo "Fix options:"
            echo "  1. Remove the src/kailash/ reference (if it's an accidental leak), OR"
            echo "  2. Add the file path to $ALLOWLIST (if the file legitimately needs to"
            echo "     reference SDK source — e.g., provenance Origin: lines, compliance"
            echo "     tracking, or navigation skills that teach SDK layout)"
            echo ""
            echo "If this fired during a downstream /sync of a fresh loom release,"
            echo "the upstream coc-sync allowlist auto-refresh did not run. Re-run"
            echo "/sync at loom/ — Step 7.5 will append the new entries."
            exit 1
          fi

          echo "✓ No contamination detected (allowlist: $(wc -l < /tmp/allowed.txt) entries)"

          # Count agents and skills
          echo "Agents: $(find .claude/agents -name '*.md' | wc -l)"
          echo "Skills: $(find .claude/skills -name '*.md' | wc -l)"
          echo "Rules: $(find .claude/rules -name '*.md' | wc -l)"
          echo "Commands: $(find .claude/commands -name '*.md' | wc -l)"
          echo "All checks passed!"
